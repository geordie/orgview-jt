name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check generated views are current
      run: |
        make generate
        git diff --exit-code -- internal/web/views

    - name: Vet
      run: make vet

    - name: Run tests
      run: make test
