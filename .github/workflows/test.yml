name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: orgview_cba_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:password@127.0.0.1:3306/orgview_cba_test
      CI: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2

    - name: Cache Ruby installation
      uses: actions/cache@v3
      with:
        path: |
          ~/.rubies
          ~/.gem
        key: ${{ runner.os }}-ruby-3.3.1-${{ hashFiles('Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-ruby-3.3.1-
          ${{ runner.os }}-ruby-

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.1
        bundler-cache: true

    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P"3306" -uroot -ppassword --silent; do
          echo "Waiting for MySQL..."
          sleep 2
        done

    - name: Set up database
      run: |
        bin/rails db:prepare

    - name: Run tests
      run: bin/rails test

    - name: Run system tests
      run: bin/rails test:system
