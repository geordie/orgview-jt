
services:
  mysql:
    image: mysql
    ports:
      - "3308:3308"
    volumes_from:
      - dbdata
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dev
      - MYSQL_TCP_PORT=3308

  dbdata:
    image: tianon/true
    volumes:
      - /var/lib/mysql

  app-cba:
    build: .
    environment:
      RAILS_ENV: development
    ports:
      - '3001:3001'
    volumes_from:
      - appdata
    links:
      - "mysql"

  appdata:
    image: tianon/true
    volumes:
      - ".:/workspace"
