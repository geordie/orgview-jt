
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3308:3308"
    volumes:
      - orgview-jt-mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dev
      - MYSQL_TCP_PORT=3308
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3308", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g

  app:
    build: .
    environment:
      RAILS_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - orgview-jt-app-log:/workspace/log
      - orgview-jt-app-tmp:/workspace/tmp
      - orgview-jt-app-storage:/workspace/storage
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1g

volumes:
  orgview-jt-mysql-data:
    name: orgview-jt-mysql-data
  orgview-jt-app-log:
    name: orgview-jt-app-log
  orgview-jt-app-tmp:
    name: orgview-jt-app-tmp
  orgview-jt-app-storage:
    name: orgview-jt-app-storage
