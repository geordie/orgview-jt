# SQLite. The database file lives in storage/, which docker-compose mounts as
# the named volume orgview-jt-app-storage. Keep it on a named volume (or a
# local disk), never on a macOS bind mount: SQLite's file locking is not
# reliable over Docker Desktop's host file sharing.
#
# Rails 7.1 turns on foreign keys and WAL mode for SQLite by default.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
